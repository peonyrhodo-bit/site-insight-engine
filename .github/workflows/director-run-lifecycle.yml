name: Director run lifecycle tests

on:
  pull_request:
    paths:
      - "server.py"
      - "memory/**"
      - "director/**"
      - "data/**"
      - "scheduler/**"
      - "tests/test_wakeup*.py"
      - "tests/test_autonomous_worker_retry*.py"
      - "tests/test_director_run_lifecycle*.py"
      - "tests/test_research_executor*.py"
      - "tests/test_research_plan_queries.py"
      - "tests/test_project_state_read_only.py"
      - ".github/workflows/director-run-lifecycle.yml"
  push:
    branches:
      - main
      - fix/director-run-lifecycle

jobs:
  lifecycle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Run Director lifecycle tests
        run: python -m pytest -q
