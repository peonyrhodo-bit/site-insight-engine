name: Supabase history pagination tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/supabase-history-pagination"]

jobs:
  history-pagination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run pagination regression tests
        run: python -m unittest tests.test_supabase_history_pagination -v
      - name: Run full unittest suite
        run: python -m unittest discover -v
