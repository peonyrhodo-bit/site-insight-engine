name: PR-B idempotency characterization

on:
  push:
    branches:
      - design/idempotency-lookup-pr-b-20261120
  workflow_dispatch:

jobs:
  offline-characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run PR-B offline tests
        run: python -m pytest -q tests/test_pr_b_idempotency_characterization.py
