name: Reliability audit tests

on:
  pull_request:
  push:
    branches:
      - main
      - "audit/**"
      - "test/pr-b-isolated-postgres-harness-20261120"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run regression and repository tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Validate isolated PR-B SQL fixture and connection gate (offline)
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_pr_b_sql_fixture_contract.py tests/test_pr_b_postgres_integration_gate.py tests/test_pr_b_finalize_sql_contract.py tests/test_pr_b_reserve_sql_contract.py tests/test_pr_b_postgres_scenarios.py
      - name: Run PR-B characterization explicitly
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_pr_b_idempotency_characterization.py
