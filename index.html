<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Аналитика для Дашули</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f7f7f7;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 14px 24px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .mode-button {
            background: #e9ecef;
            color: #333;
        }

        .mode-button:hover {
            background: #d6d9dc;
        }

        .mode-button.active {
            background: #007bff;
            color: white;
        }

        .radar-controls {
            display: none;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .radar-controls.active {
            display: flex;
        }

        .radar-controls label {
            font-weight: bold;
        }

        .radar-controls select {
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
        }

        .radar-button {
            background: #28a745;
        }

        .radar-button:hover {
            background: #218838;
        }

        #status {
            margin: 15px 0;
        }

        .loading {
            color: #666;
        }

        .error {
            color: #c62828;
            background: #ffebee;
            padding: 12px;
            border-radius: 6px;
        }

        .summary {
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        th {
            background: #f0f0f0;
            font-weight: bold;
        }

        tr:hover {
            background: #fafafa;
        }

        .number {
            width: 50px;
            text-align: center;
        }

        .channel-title {
            font-weight: bold;
            font-size: 16px;
        }

        .channel-id {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
            word-break: break-all;
        }

        .video-title {
            font-weight: bold;
            font-size: 15px;
        }

        .video-title a {
            color: #222;
            text-decoration: none;
        }

        .video-title a:hover {
            color: #007bff;
            text-decoration: underline;
        }

        .video-id {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
            word-break: break-all;
        }

        .description {
            color: #555;
            line-height: 1.4;
        }

        .date {
            white-space: nowrap;
        }

        .number-value {
            white-space: nowrap;
            font-weight: bold;
        }

        .growth-value {
            white-space: nowrap;
            font-weight: bold;
        }

        .age-value {
            white-space: nowrap;
        }

        @media (max-width: 700px) {

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .mode-buttons {
                flex-direction: column;
            }

            .radar-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .radar-controls select,
            .radar-controls button {
                width: 100%;
            }

            th,
            td {
                padding: 10px;
            }
        }

    </style>

</head>

<body>

    <h1>Аналитика для Дашули</h1>

    <p class="subtitle">
        Исследуйте YouTube: каналы, видео, темы и интересы аудитории.
    </p>


    <!-- ПОИСК -->

    <div class="search-box">

        <input
            type="text"
            id="query"
            placeholder="Например: панды, дорамы, AI, финансы..."
        >

        <button id="searchButton">
            🔍 Найти каналы
        </button>

    </div>


    <!-- РЕЖИМЫ -->

    <div class="mode-buttons">

        <button
            id="channelsMode"
            class="mode-button active"
        >
            📺 Каналы
        </button>

        <button
            id="videosMode"
            class="mode-button"
        >
            🎬 Видео
        </button>

        <button
            id="radarMode"
            class="mode-button"
        >
            🚀 Радар роста
        </button>

    </div>


    <!-- НАСТРОЙКИ РАДАРА -->

    <div
        id="radarControls"
        class="radar-controls"
    >

        <label for="regionSelect">
            Регион:
        </label>

        <select id="regionSelect">

            <option value="US">
                🇺🇸 США
            </option>

            <option value="RU">
                🇷🇺 Россия
            </option>

            <option value="IN">
                🇮🇳 Индия
            </option>

            <option value="ZA">
                🇿🇦 ЮАР
            </option>

            <option value="CN">
                🇨🇳 Китай
            </option>

        </select>


        <label for="hoursSelect">
            Период:
        </label>

        <select id="hoursSelect">

            <option value="24">
                Последние 24 часа
            </option>

            <option value="48">
                Последние 48 часов
            </option>

            <option value="72" selected>
                Последние 72 часа
            </option>

        </select>


        <button
            id="radarButton"
            class="radar-button"
        >
            🚀 Запустить радар
        </button>

    </div>


    <div id="status"></div>

    <div id="summary"></div>

    <div id="results"></div>


    <script>

        const input =
            document.getElementById("query");

        const button =
            document.getElementById("searchButton");

        const channelsMode =
            document.getElementById("channelsMode");

        const videosMode =
            document.getElementById("videosMode");

        const radarMode =
            document.getElementById("radarMode");

        const radarControls =
            document.getElementById("radarControls");

        const radarButton =
            document.getElementById("radarButton");

        const regionSelect =
            document.getElementById("regionSelect");

        const hoursSelect =
            document.getElementById("hoursSelect");

        const status =
            document.getElementById("status");

        const summary =
            document.getElementById("summary");

        const results =
            document.getElementById("results");


        let currentMode = "channels";


        // =========================================================
        // ПЕРЕКЛЮЧЕНИЕ РЕЖИМА
        // =========================================================

        channelsMode.addEventListener("click", () => {

            currentMode = "channels";

            channelsMode.classList.add("active");

            videosMode.classList.remove("active");

            radarMode.classList.remove("active");

            radarControls.classList.remove("active");

            button.style.display = "block";

            button.innerText = "🔍 Найти каналы";

            input.style.display = "block";

            input.placeholder =
                "Например: панды, дорамы, AI, финансы...";

            status.innerHTML = "";

            summary.innerHTML = "";

            results.innerHTML = "";

        });


        videosMode.addEventListener("click", () => {

            currentMode = "videos";

            videosMode.classList.add("active");

            channelsMode.classList.remove("active");

            radarMode.classList.remove("active");

            radarControls.classList.remove("active");

            button.style.display = "block";

            button.innerText = "🔍 Найти видео";

            input.style.display = "block";

            input.placeholder =
                "Например: pandas, AI tools, finance...";

            status.innerHTML = "";

            summary.innerHTML = "";

            results.innerHTML = "";

        });


        radarMode.addEventListener("click", () => {

            currentMode = "radar";

            radarMode.classList.add("active");

            channelsMode.classList.remove("active");

            videosMode.classList.remove("active");

            radarControls.classList.add("active");

            button.style.display = "none";

            input.style.display = "none";

            status.innerHTML = "";

            summary.innerHTML = "";

            results.innerHTML = "";

        });


        // =========================================================
        // ОСНОВНОЙ ПОИСК
        // =========================================================

        async function search() {

            if (currentMode === "channels") {

                await searchChannels();

            } else if (currentMode === "videos") {

                await searchVideos();

            }

        }


        // =========================================================
        // ПОИСК КАНАЛОВ
        // =========================================================

        async function searchChannels() {

            const query = input.value.trim();


            if (!query) {

                status.innerHTML =
                    '<div class="error">Пожалуйста, введите поисковый запрос.</div>';

                summary.innerHTML = "";

                results.innerHTML = "";

                return;

            }


            button.disabled = true;


            status.innerHTML =
                '<div class="loading">🔄 Ищу каналы на YouTube...</div>';

            summary.innerHTML = "";

            results.innerHTML = "";


            try {

                const response = await fetch(
                    `/search-channels?query=${encodeURIComponent(query)}`
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error || "Ошибка при поиске каналов"
                    );

                }


                if (data.error) {

                    throw new Error(data.error);

                }


                status.innerHTML = "";


                summary.innerHTML =
                    `Найдено каналов: ${data.count}`;


                if (
                    !data.channels ||
                    data.channels.length === 0
                ) {

                    results.innerHTML =
                        "<p>По вашему запросу каналы не найдены.</p>";

                    return;

                }


                let tableHTML = `

                    <div class="table-container">

                        <table>

                            <thead>

                                <tr>

                                    <th class="number">№</th>

                                    <th>Канал</th>

                                    <th>Описание</th>

                                    <th>Дата создания</th>

                                </tr>

                            </thead>

                            <tbody>

                `;


                data.channels.forEach((channel, index) => {

                    const number = index + 1;

                    const title =
                        channel.title || "Без названия";

                    const description =
                        channel.description || "Нет описания";

                    const publishedAt =
                        channel.published_at
                            ? new Date(
                                channel.published_at
                            ).toLocaleDateString("ru-RU")
                            : "Неизвестно";


                    tableHTML += `

                        <tr>

                            <td class="number">
                                ${number}
                            </td>

                            <td>

                                <div class="channel-title">
                                    ${title}
                                </div>

                                <div class="channel-id">
                                    ${channel.channel_id || ""}
                                </div>

                            </td>

                            <td>

                                <div class="description">
                                    ${description}
                                </div>

                            </td>

                            <td class="date">
                                ${publishedAt}
                            </td>

                        </tr>

                    `;

                });


                tableHTML += `

                            </tbody>

                        </table>

                    </div>

                `;


                results.innerHTML = tableHTML;


            } catch (error) {

                status.innerHTML =
                    `<div class="error">❌ ${error.message}</div>`;

            } finally {

                button.disabled = false;

            }

        }


        // =========================================================
        // ПОИСК ВИДЕО
        // =========================================================

        async function searchVideos() {

            const query = input.value.trim();


            if (!query) {

                status.innerHTML =
                    '<div class="error">Пожалуйста, введите поисковый запрос.</div>';

                summary.innerHTML = "";

                results.innerHTML = "";

                return;

            }


            button.disabled = true;


            status.innerHTML =
                '<div class="loading">🔄 Ищу видео на YouTube...</div>';

            summary.innerHTML = "";

            results.innerHTML = "";


            try {

                const response = await fetch(
                    `/search-videos?query=${encodeURIComponent(query)}&max_results=20`
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error || "Ошибка при поиске видео"
                    );

                }


                if (data.error) {

                    throw new Error(data.error);

                }


                status.innerHTML = "";


                summary.innerHTML =
                    `Найдено видео: ${data.count}`;


                if (
                    !data.videos ||
                    data.videos.length === 0
                ) {

                    results.innerHTML =
                        "<p>По вашему запросу видео не найдены.</p>";

                    return;

                }


                let tableHTML = `

                    <div class="table-container">

                        <table>

                            <thead>

                                <tr>

                                    <th class="number">№</th>

                                    <th>Видео</th>

                                    <th>Канал</th>

                                    <th>Просмотры</th>

                                    <th>Лайки</th>

                                    <th>Комментарии</th>

                                    <th>Дата</th>

                                    <th>Длительность</th>

                                </tr>

                            </thead>

                            <tbody>

                `;


                data.videos.forEach((video, index) => {

                    const number = index + 1;

                    const title =
                        video.title || "Без названия";

                    const channelTitle =
                        video.channel_title || "Неизвестный канал";

                    const views =
                        formatNumber(video.views);

                    const likes =
                        formatNumber(video.likes);

                    const comments =
                        formatNumber(video.comments);

                    const publishedAt =
                        video.published_at
                            ? new Date(
                                video.published_at
                            ).toLocaleDateString("ru-RU")
                            : "Неизвестно";

                    const duration =
                        formatDuration(video.duration);


                    tableHTML += `

                        <tr>

                            <td class="number">
                                ${number}
                            </td>


                            <td>

                                <div class="video-title">

                                    <a
                                        href="https://www.youtube.com/watch?v=${video.video_id}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        ${title}
                                    </a>

                                </div>

                                <div class="video-id">
                                    ${video.video_id || ""}
                                </div>

                            </td>


                            <td>

                                <div class="channel-title">
                                    ${channelTitle}
                                </div>

                                <div class="channel-id">
                                    ${video.channel_id || ""}
                                </div>

                            </td>


                            <td class="number-value">
                                ${views}
                            </td>


                            <td class="number-value">
                                ${likes}
                            </td>


                            <td class="number-value">
                                ${comments}
                            </td>


                            <td class="date">
                                ${publishedAt}
                            </td>


                            <td class="date">
                                ${duration}
                            </td>

                        </tr>

                    `;

                });


                tableHTML += `

                            </tbody>

                        </table>

                    </div>

                `;


                results.innerHTML = tableHTML;


            } catch (error) {

                status.innerHTML =
                    `<div class="error">❌ ${error.message}</div>`;

            } finally {

                button.disabled = false;

            }

        }


        // =========================================================
        // РАДАР РОСТА
        // =========================================================

        radarButton.addEventListener(
            "click",
            runRadar
        );


        async function runRadar() {

            const region =
                regionSelect.value;

            const hours =
                hoursSelect.value;


            radarButton.disabled = true;


            status.innerHTML =
                '<div class="loading">🚀 Сканирую свежие быстрорастущие видео...</div>';

            summary.innerHTML = "";

            results.innerHTML = "";


            try {

                const response = await fetch(
                    `/radar-videos?max_results=50&region_code=${encodeURIComponent(region)}&hours_back=${encodeURIComponent(hours)}`
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error || "Ошибка радара"
                    );

                }


                if (data.error) {

                    throw new Error(data.error);

                }


                status.innerHTML = "";


                summary.innerHTML =
                    `🚀 Радар: ${data.count} видео за последние ${data.hours_back} ч. | регион: ${data.region_code}`;


                if (
                    !data.videos ||
                    data.videos.length === 0
                ) {

                    results.innerHTML =
                        "<p>Радар не нашёл подходящих видео.</p>";

                    return;

                }


                let tableHTML = `

                    <div class="table-container">

                        <table>

                            <thead>

                                <tr>

                                    <th class="number">№</th>

                                    <th>Видео</th>

                                    <th>Канал</th>

                                    <th>Возраст</th>

                                    <th>Просмотры</th>

                                    <th>Просм./час</th>

                                    <th>Эквивалент 24ч</th>

                                    <th>Дата</th>

                                </tr>

                            </thead>

                            <tbody>

                `;


                data.videos.forEach((video, index) => {

                    const number =
                        index + 1;

                    const title =
                        video.title || "Без названия";

                    const channelTitle =
                        video.channel_title || "Неизвестный канал";

                    const views =
                        formatNumber(video.views);

                    const viewsPerHour =
                        formatNumber(video.views_per_hour);

                    const viewsPer24h =
                        formatNumber(video.views_per_24h);

                    const ageHours =
                        video.age_hours;

                    const publishedAt =
                        video.published_at
                            ? new Date(
                                video.published_at
                            ).toLocaleString(
                                "ru-RU"
                            )
                            : "Неизвестно";


                    tableHTML += `

                        <tr>

                            <td class="number">
                                ${number}
                            </td>


                            <td>

                                <div class="video-title">

                                    <a
                                        href="https://www.youtube.com/watch?v=${video.video_id}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        ${title}
                                    </a>

                                </div>

                                <div class="video-id">
                                    ${video.video_id || ""}
                                </div>

                            </td>


                            <td>

                                <div class="channel-title">
                                    ${channelTitle}
                                </div>

                                <div class="channel-id">
                                    ${video.channel_id || ""}
                                </div>

                            </td>


                            <td class="age-value">
                                ${ageHours} ч.
                            </td>


                            <td class="number-value">
                                ${views}
                            </td>


                            <td class="growth-value">
                                ${viewsPerHour}
                            </td>


                            <td class="growth-value">
                                ${viewsPer24h}
                            </td>


                            <td class="date">
                                ${publishedAt}
                            </td>

                        </tr>

                    `;

                });


                tableHTML += `

                            </tbody>

                        </table>

                    </div>

                `;


                results.innerHTML =
                    tableHTML;


            } catch (error) {

                status.innerHTML =
                    `<div class="error">❌ ${error.message}</div>`;

            } finally {

                radarButton.disabled = false;

            }

        }


        // =========================================================
        // ФОРМАТИРОВАНИЕ ЧИСЕЛ
        // =========================================================

        function formatNumber(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "—";

            }


            return Number(value).toLocaleString("ru-RU");

        }


        // =========================================================
        // ФОРМАТИРОВАНИЕ ДЛИТЕЛЬНОСТИ
        // =========================================================

        function formatDuration(duration) {

            if (!duration) {

                return "—";

            }


            const match =
                duration.match(
                    /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/
                );


            if (!match) {

                return duration;

            }


            const hours =
                parseInt(match[1] || "0");

            const minutes =
                parseInt(match[2] || "0");

            const seconds =
                parseInt(match[3] || "0");


            if (hours > 0) {

                return (
                    hours +
                    ":" +
                    String(minutes).padStart(2, "0") +
                    ":" +
                    String(seconds).padStart(2, "0")
                );

            }


            return (
                minutes +
                ":" +
                String(seconds).padStart(2, "0")
            );

        }


        // =========================================================
        // КНОПКА И ENTER
        // =========================================================

        button.addEventListener(
            "click",
            search
        );


        input.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {

                    search();

                }

            }
        );

    </script>

</body>

</html>
